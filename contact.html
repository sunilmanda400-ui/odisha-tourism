<!-- ============ HEADER ============ -->
<header class="header">

  <div class="hero">
    <h1>Contact Us</h1>
    <p>We're here to help you explore Odisha</p>
  </div>
</header>

<section class="container">

  <!-- Contact Info -->
  <div class="info-section">
    <div class="info-card">
      <h3>Email</h3>
      <p>support@odishatourism.com</p>
    </div>

    <div class="info-card">
      <h3>Phone</h3>
      <p>+91 7008599551</p>
    </div>

    <div class="info-card">
      <h3>Address</h3>
      <p>Berhampur, Odisha, India</p>
    </div>
  </div>

  <!-- Contact Form -->
  <div class="card">
    <h2>Send Us a Message</h2>

    <form id="contactForm" class="contact-form">
  <div class="row">
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="email" id="email" placeholder="Your Email" required>
  </div>

  <input type="text" id="subject" placeholder="Subject" required>

  <textarea rows="5" id="message" placeholder="Your Message" required></textarea>

  <button type="submit">Send Message</button>
</form>

  </div>

  <!-- Map -->
  <div class="card">
    <h2>Our Location</h2>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15456921.246197777!2d69.82074302749635!3d18.946331048823453!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a3d51f13520e5c9%3A0xaae3a4fd34b3054b!2sKalki%20Agro%20Food.Marthapalli!5e0!3m2!1sen!2sin!4v1769757709614!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>

</section>
