<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Plan | Odisha Tourism</title>
  <link rel="stylesheet" href="trip-plan2.css">
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

 <nav class="navbar" id="navbar">
  <div class="logo">
    <img src="images/817110e8-13d4-4ce3-9e5b-2a49bf0a708a-removebg-preview.png" alt="Tourism Odisha">
  </div>

  <ul class="nav-links">
    <li><a href="loginpage.html">Home</a></li>
    <li><a href="about.html">About Odisha</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="login2.html">Login / Sign in</a></li>
    <li><a href="add-to-trip.html"><i class="fa-solid fa-suitcase-rolling"></i></a></li>
    <li><a href="booking-history.html">History</a></li>
     <li><button onclick="logout()" class="logout-btn">Logout</button></li>
  </ul>
</nav>


  <div class="trip-container">
    <h2>Trip Plan Details</h2>

    <!-- Selected Places -->
    <div class="form-group">
      <label>Selected Tourist Places</label>
      <ul id="selectedPlaces" class="places-list"></ul>
    </div>

    <!-- Starting Location -->
    <div class="form-group">
      <label>Starting Location</label>
      <select id="start">
        <option value="">Select City</option>
      </select>
    </div>

    <!-- Travel Date -->
    <div class="form-group">
      <label>Travel Date</label>
      <input type="date" id="date">
    </div>

    <!-- Number of People -->
    <div class="form-group">
      <label>Number of People</label>
      <input type="number" id="people" min="1" placeholder="Enter number of people">
    </div>

    <div class="form-group">
      <label>Advance payment</label>
      <input type="number" id="advancePayment" min="1" readonly placeholder="4000">
    </div>

    <button onclick="continueTrip()">Continue</button>
  </div>


  <script src="navbar.js"></script>
  <script src="trip-plan2.js"></script>
</body>
</html>
