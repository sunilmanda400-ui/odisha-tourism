<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Odisha Tourism</title>
  <link rel="stylesheet" href="login2.css">
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <nav class="navbar" id="navbar">
  <div class="logo">
    <img src="images/817110e8-13d4-4ce3-9e5b-2a49bf0a708a-removebg-preview.png" alt="Tourism Odisha">
  </div>

  <ul class="nav-links">
    <li><a href="loginpage.html">Home</a></li>
    <li><a href="about.html">About Odisha</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="login2.html">Login / Sign in</a></li>
    <li><a href="add-to-trip.html"><i class="fa-solid fa-suitcase-rolling"></i></a></li>
    <li><a href="booking-history.html">History</a></li>
    <li><button onclick="logout()" class="logout-btn">Logout</button></li>
  </ul>
  

</nav>


<!-- ROTATING WHEEL BACKGROUND -->
<div class="rotating-wheel"></div>

<div class="login-wrapper">

  <!-- LEFT SIDE IMAGE -->
  <div class="image-section">
    <img src="images/konark_will-removebg-preview.png" id="konark" alt="Konark Sun Temple">
    <h2>Explore Odisha</h2>
    <p>Plan • Travel • Experience</p>
  </div>

  <!-- RIGHT SIDE FORM -->
  <div class="form-section" id="formCard">

    <h2 id="title">Login</h2>

    <!-- LOGIN -->
    <form id="loginForm">
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Login</button>

      <p class="switch">
        New here? <span onclick="openRegister()">Create account</span>
      </p>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" class="hidden">
      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Register</button>

      <p class="switch">
        Already registered? <span onclick="openLogin()">Login</span>
      </p>
    </form>

  </div>
</div>
<script ></script>
<script src="login2.js"></script>
</body>
</html>
